<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="snake.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1>Snake Game</h1>
      <p>Score: <span id="score">0</span></p>
    </div>

    <div class="canvas-box">
      <canvas id="game-board" width="400" height="400"></canvas>
      <div class="game-message" id="game-message">
        <h2 id="message-title">Snake Game</h2>
        <p id="message-text">Press Start to play</p>
        <button id="start-button" type="button">Start Game</button>
      </div>
    </div>

    <div class="controls">
      <button id="upBtn" type="button">▲</button>
      <div class="row">
        <button id="leftBtn" type="button">◀</button>
        <button id="downBtn" type="button">▼</button>
        <button id="rightBtn" type="button">▶</button>
      </div>
    </div>

    <p class="tip">Use the arrow keys or buttons to move.</p>
  </div>

  <script src="snake.js"></script>
</body>
</html>
