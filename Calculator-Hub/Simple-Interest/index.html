<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple-Interest</title>
    <link rel="stylesheet" href="interest.css">
    <link rel="shortcut icon" href="./Assets/fav_icon.png" type="image/x-icon">
</head>
<body>
    <div class="simple-interest-calc">
        <h1>Simple Interest</h1>

        <p class="formula">SI = (P * T * R) / 100</p>

        <form id="interest_form">

        
            <label for="principal">Principal (P)</label>

            <input type="number" id="principal" placeholder="Enter Principal" required>

            <label for="time">Time (T in years)</label>
        
            <input type="number" id="time"  step= "any" placeholder="Enter Time" required>

            <label for="rate">Rate (R%)</label>

            <input type="number" id="rate" placeholder="Enter Rate" required>

            <button id="calc" type="submit">Calculate</button>

            <button id="clear" class="clear" type="button">Clear</button>
        </form>

        <div class="result">
                <p>Simple-Interest: <span id="interest">0</span></p>

                <p>Total Amount: <span id="amount">0</span></p>

        </div>

    </div>

    <script src="interest.js"></script>

</body>
</html>
